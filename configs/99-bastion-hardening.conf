# Drop-in path: /etc/ssh/sshd_config.d/99-bastion-hardening.conf

# Key-only authentication
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# Session and brute-force limits
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable X11/agent forwarding; allow local TCP tunnel strictly to PostgreSQL (9999)
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
PermitOpen localhost:9999 127.0.0.1:9999
